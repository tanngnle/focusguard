<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>FocusGuard</title>
  <link rel="stylesheet" href="../fonts/fonts.css">
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <div class="popup-container">

    <!-- Header -->
    <header class="popup-header">
      <div class="header-left">
        <img src="../icons/icon48.png" alt="FocusGuard" class="header-icon">
        <div class="header-text">
          <h1>FocusGuard</h1>
          <p class="header-subtitle">Stay focused, stay sharp</p>
        </div>
      </div>
      <label class="master-toggle" id="master-toggle">
        <input type="checkbox" id="master-toggle-input" checked aria-label="Enable FocusGuard blocking">
        <span class="toggle-slider"></span>
      </label>
    </header>

    <!-- Add Website Section -->
    <section class="add-site-section">
      <div class="input-group">
        <input
          type="text"
          id="site-input"
          placeholder="e.g. twitter.com"
          autocomplete="off"
          spellcheck="false"
        >
        <button id="add-site-btn" class="btn-add" title="Add website" aria-label="Add website">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round">
            <line x1="12" y1="5" x2="12" y2="19"></line>
            <line x1="5" y1="12" x2="19" y2="12"></line>
          </svg>
        </button>
      </div>
      <p class="input-hint" id="input-hint"></p>
    </section>

    <!-- Blocked Sites List -->
    <section class="sites-list-section">
      <div class="section-header">
        <h2>Blocked Sites</h2>
        <span class="site-count" id="site-count">0</span>
      </div>
      <div class="sites-list" id="sites-list">
        <div class="empty-state" id="empty-state">
          <svg width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" opacity="0.3">
            <path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"></path>
          </svg>
          <p>No sites blocked yet</p>
          <span>Add a website above to start focusing</span>
        </div>
      </div>
    </section>

    <!-- Pomodoro Settings -->
    <section class="settings-section">
      <button class="settings-toggle" id="settings-toggle" aria-expanded="false" aria-controls="settings-panel">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
          <circle cx="12" cy="12" r="3"></circle>
          <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83-2.83l.06-.06A1.65 1.65 0 0 0 4.68 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.68a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"></path>
        </svg>
        <span>Timer Settings</span>
        <svg class="chevron" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round">
          <polyline points="6 9 12 15 18 9"></polyline>
        </svg>
      </button>

      <div class="settings-panel" id="settings-panel">
        <div class="setting-item">
          <div class="setting-label">
            <span class="setting-dot work"></span>
            <span>Work Duration</span>
            <span class="setting-value" id="work-value">25 min</span>
          </div>
          <input type="range" id="work-slider" min="1" max="60" value="25" class="slider work-slider" aria-valuetext="25 minutes">
        </div>

        <div class="setting-item">
          <div class="setting-label">
            <span class="setting-dot short-break"></span>
            <span>Short Break</span>
            <span class="setting-value" id="short-break-value">5 min</span>
          </div>
          <input type="range" id="short-break-slider" min="1" max="30" value="5" class="slider short-break-slider" aria-valuetext="5 minutes">
        </div>

        <div class="setting-item">
          <div class="setting-label">
            <span class="setting-dot long-break"></span>
            <span>Long Break</span>
            <span class="setting-value" id="long-break-value">15 min</span>
          </div>
          <input type="range" id="long-break-slider" min="1" max="60" value="15" class="slider long-break-slider" aria-valuetext="15 minutes">
        </div>

        <div class="setting-item">
          <div class="setting-label">
            <span class="setting-dot rounds"></span>
            <span>Rounds</span>
            <span class="setting-value" id="rounds-value">4</span>
          </div>
          <input type="range" id="rounds-slider" min="1" max="8" value="4" class="slider rounds-slider" aria-valuetext="4 rounds">
        </div>
      </div>
    </section>

    <!-- Footer -->
    <footer class="popup-footer">
      <span>FocusGuard v1.0</span>
    </footer>
  </div>

  <script type="module" src="popup.js"></script>
</body>
</html>
