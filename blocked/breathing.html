<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>FocusGuard — Breathe</title>
  <link rel="stylesheet" href="../fonts/fonts.css">
  <link rel="stylesheet" href="../shared/theme.css">
  <style>
    /* Page-local layout only — every color comes from shared/theme.css
       (loaded above). Accent: the long-break violet, the single hue
       for this calm-down interstitial. */
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: var(--font-body);
      background: var(--bg-dark);
      color: var(--text-primary);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
    }

    .breathing-container {
      text-align: center;
      max-width: 500px;
      padding: 2rem;
    }

    .panda-emoji {
      font-size: 4rem;
      margin-bottom: 1rem;
      animation: float 3s ease-in-out infinite;
    }

    @keyframes float {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-10px); }
    }

    h1 {
      font-family: var(--font-display);
      font-size: 1.5rem;
      margin-bottom: 1rem;
      color: var(--long-break-color);
    }

    .breathing-circle {
      width: 200px;
      height: 200px;
      border-radius: 50%;
      background: var(--long-break-glow);
      border: 1px solid var(--long-break-color);
      margin: 2rem auto;
      display: flex;
      align-items: center;
      justify-content: center;
      animation: breathe 5s ease-in-out infinite;
    }

    @keyframes breathe {
      0%, 100% { transform: scale(1); opacity: 0.7; }
      50% { transform: scale(1.2); opacity: 1; }
    }

    .breathing-text {
      font-size: 1.2rem;
      color: var(--text-primary);
      font-weight: 500;
    }

    .timer-display {
      font-family: var(--font-display);
      font-size: 3rem;
      color: var(--long-break-color);
      margin: 1rem 0;
    }

    .intention-prompt {
      margin-top: 2rem;
    }

    .intention-prompt label {
      display: block;
      margin-bottom: 0.5rem;
      color: var(--text-secondary);
      font-size: 0.9rem;
    }

    .intention-input {
      width: 100%;
      padding: 0.75rem;
      border: 1px solid var(--hairline);
      border-radius: var(--radius-sm);
      background: var(--surface);
      color: var(--text-primary);
      font-size: 1rem;
      font-family: inherit;
    }

    .intention-input:focus {
      outline: none;
      border-color: var(--long-break-color);
    }

    .continue-btn {
      margin-top: 2rem;
      padding: 1rem 2rem;
      background: var(--long-break-color);
      color: var(--bg-dark);
      border: none;
      border-radius: var(--radius-sm);
      font-size: 1rem;
      font-weight: 600;
      cursor: pointer;
      opacity: 0.5;
      pointer-events: none;
      transition: all 0.3s ease;
    }

    .continue-btn.active {
      opacity: 1;
      pointer-events: auto;
    }

    .continue-btn.active:hover {
      filter: brightness(1.12);
      transform: translateY(-2px);
    }

    .blocked-domain {
      margin-top: 1rem;
      font-size: 0.85rem;
      color: var(--text-muted);
    }

    .blocked-domain strong {
      color: var(--long-break-color);
    }
  </style>
</head>
<body>
  <div class="breathing-container">
    <div class="panda-emoji">🐼</div>
    <h1>Take a moment to breathe</h1>

    <div class="breathing-circle">
      <span class="breathing-text" id="breathing-text">Breathe in...</span>
    </div>

    <div class="timer-display" id="timer-display">5</div>

    <div class="intention-prompt">
      <label for="intention">What's your intention for visiting this site?</label>
      <input
        type="text"
        id="intention"
        class="intention-input"
        placeholder="e.g., Watch a specific tutorial, check messages..."
        autocomplete="off"
      >
    </div>

    <button class="continue-btn" id="continue-btn">Continue to site</button>

    <div class="blocked-domain">
      You were trying to visit <strong id="domain-display">...</strong>
    </div>
  </div>

  <script type="module" src="breathing.js"></script>
</body>
</html>
